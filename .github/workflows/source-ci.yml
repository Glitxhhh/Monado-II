name: Source guards and authored fixtures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Source checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      # Exact publication hashes require original bytes on both operating systems.
      # Job-local Git configuration avoids changing runner/global configuration.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out reviewed sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Verify exact source manifest and content guards
        run: python -B tools/publication_guard.py .
      - name: Run authored source-tooling and synthetic component fixtures
        # Root tests only. No game input, guest, vendor SDK or game build is used.
        # A supported POSIX host may compile the small authored plain-font fixture.
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify tests left the reviewed source unchanged
        run: python -B tools/publication_guard.py .
